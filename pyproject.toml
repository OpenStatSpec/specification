[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstatspec-specification"
version = "0.1.0"
description = "Installable OpenStatSpec specification resources and semantic validators"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OpenStatSpec"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/openstatspec_specification"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "openstatspec_specification/sql"
