name: CI

on:
  push:
  pull_request:

jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement requirements-validation.txt
      - run: python tools/validate_repository.py
