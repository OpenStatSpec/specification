name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      # v7.0.0: https://github.com/actions/checkout/commit/3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v7.0.0: https://github.com/actions/setup-python/commit/5fda3b95a4ea91299a34e894583c3862153e4b97
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python tools/validate_repository.py
